      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        accuracy:
          type: number
          format: double
          minimum: 0
        recorded_at:
          type: string
          format: date-time
          description: ISO 8601 device timestamp of the fix, with timezone (e.g. 2026-08-26T12:20:15Z).
        speed:
          type: number
          format: double
          minimum: 0
          nullable: true
        heading:
          type: number
          format: double
          maximum: 360
          minimum: 0
          nullable: true
        altitude:
          type: number
          format: double
          nullable: true
        device_id:
          type: string
          maxLength: 64
        session_id:
          type: string
          maxLength: 64
        client_event_id:
          type: string
          nullable: true
          description: Idempotency key generated by the PWA. Re-sending the same key
            after a network failure returns the original result instead of duplicating
            it.
          maxLength: 64
