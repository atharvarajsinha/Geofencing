      - date
      - effective_status
      - geofence_id
      - geofence_name
      - last_location
      - last_seen_at
    LocationUpdate:
      type: object
      description: Stored fix, as returned by history endpoints.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        accuracy:
          type: number
          format: double
          readOnly: true
          description: Radius of 68% confidence in metres, as reported by the browser.
        speed:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Metres per second.
        heading:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Degrees clockwise from true north.
        altitude:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Metres above WGS84.
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          description: Device clock time of the fix.
        received_at:
          type: string
          format: date-time
          readOnly: true
          description: Server time the fix was accepted.
        delay_seconds:
          type: number
          format: double
          readOnly: true
        device_id:
          type: string
          readOnly: true
        session_id:
          type: string
          readOnly: true
        client_event_id:
          type: string
          readOnly: true
          nullable: true
          description: Client generated idempotency key. Re-POSTing the same key returns
            the original result instead of creating a duplicate.
        confidence:
          allOf:
          - $ref: '#/components/schemas/ConfidenceEnum'
          readOnly: true
          description: |-
            HIGH when accuracy is within MAX_ACCEPTABLE_ACCURACY_M.

            * `HIGH` - Accuracy within the acceptable threshold
            * `LOW` - Accuracy worse than the acceptable threshold
        is_trusted:
          type: boolean
          readOnly: true
          description: False when a HIGH severity anomaly was detected. Untrusted
            fixes are stored for the audit trail but never drive presence transitions.
        is_flagged:
          type: boolean
          readOnly: true
          description: At least one anomaly was recorded for this fix.
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
          readOnly: true
      required:
      - accuracy
      - altitude
      - anomalies
      - client_event_id
      - confidence
      - delay_seconds
      - device_id
      - heading
      - id
      - is_flagged
      - is_trusted
      - latitude
      - longitude
      - received_at
      - recorded_at
      - session_id
      - speed
      - user
    LocationUpdateRequestRequest:
      type: object
