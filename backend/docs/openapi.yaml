          nullable: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/PresenceEventTypeEnum'
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        previous_status:
          allOf:
          - $ref: '#/components/schemas/PresenceStatusEnum'
          readOnly: true
        new_status:
          allOf:
          - $ref: '#/components/schemas/PresenceStatusEnum'
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        accuracy:
          type: number
          format: double
          readOnly: true
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: 'When the transition happened: device time for reading-driven
            events, server time for timeout-driven events.'
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accuracy
      - created_at
      - event_type
      - geofence
      - geofence_name
      - id
      - latitude
      - longitude
      - metadata
      - new_status
      - organization
      - presence
      - previous_status
      - reason
      - timestamp
      - user
      - user_email
      - user_name
    PresenceEventTypeEnum:
      enum:
      - ENTERED
      - EXITED
      - STALE
      - LOCATION_RESTORED
      type: string
      description: |-
        * `ENTERED` - Checked in
        * `EXITED` - Checked out
        * `STALE` - Updates stopped arriving
        * `LOCATION_RESTORED` - Updates resumed after a gap
    PresenceOutcome:
      type: object
      description: What one location update did to one presence row.
      properties:
        geofence_id:
          type: integer
        geofence_name:
          type: string
        status:
          type: string
        previous_status:
          type: string
        changed:
          type: boolean
        events:
          type: array
          items:
            type: string
        verdict:
          type: string
        confidence:
          type: string
        distance_to_boundary_m:
          type: number
          format: double
        accuracy_margin_m:
          type: number
          format: double
        consecutive_inside:
          type: integer
        consecutive_outside:
          type: integer
        required_inside_readings:
          type: integer
        required_outside_readings:
          type: integer
        check_in_at:
          type: string
          format: date-time
          nullable: true
        check_out_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
      required:
      - accuracy_margin_m
      - changed
      - check_in_at
      - check_out_at
      - confidence
      - consecutive_inside
      - consecutive_outside
      - distance_to_boundary_m
      - events
      - geofence_id
      - geofence_name
      - last_seen_at
      - previous_status
      - required_inside_readings
      - required_outside_readings
      - status
      - verdict
    PresenceStatusEnum:
      enum:
      - UNKNOWN
      - OUTSIDE
      - PRESENT
      - GONE
      - STALE
      type: string
      description: |-
        * `UNKNOWN` - No usable information yet
        * `OUTSIDE` - Confidently outside the area
        * `PRESENT` - Confidently inside the area
        * `GONE` - Was present and then confidently left
        * `STALE` - Was present, then updates stopped arriving
    PresenceSummary:
      type: object
      description: Documentation schema for the dashboard counters.
      properties:
        date:
          type: string
        total_users:
          type: integer
        tracked_users:
          type: integer
        present:
          type: integer
        gone:
          type: integer
        outside:
          type: integer
        stale:
          type: integer
        unknown:
          type: integer
        by_geofence:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - by_geofence
      - date
      - gone
      - outside
      - present
      - stale
      - total_users
      - tracked_users
      - unknown
    ReasonEnum:
      enum:
      - CONSECUTIVE_INSIDE
      - CONSECUTIVE_OUTSIDE
      - UPDATES_TIMED_OUT
      - UPDATES_RESUMED
      - DAY_ROLLOVER
      type: string
      description: |-
        * `CONSECUTIVE_INSIDE` - Required inside readings reached
        * `CONSECUTIVE_OUTSIDE` - Required outside readings reached
        * `UPDATES_TIMED_OUT` - No update within the stale timeout
        * `UPDATES_RESUMED` - A trusted update arrived after a timeout
        * `DAY_ROLLOVER` - Attendance day ended while still checked in
    TokenPairResponse:
      type: object
      description: Documentation-only schema for the login response.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: Public representation of an account.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        organization_timezone:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Grants access to the Django admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_active
      - is_staff
      - name
      - organization_id
      - organization_name
      - organization_timezone
      - phone_number
      - role
      - updated_at
    UserRoleEnum:
      enum:
      - ADMIN
      - USER
      type: string
      description: |-
        * `ADMIN` - Super administrator
        * `USER` - User
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:8000
