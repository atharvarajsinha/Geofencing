[project]
name = "geofencing-backend"
version = "1.0.0"
description = "Geofencing attendance/presence backend for a PWA frontend"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery>=5.4,<6.0",
    "redis>=5.0",
    "django-celery-beat>=2.7",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "time-machine>=2.15",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
]

[tool.black]
line-length = 95
target-version = ["py312"]

[tool.ruff]
line-length = 95
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "B008",   # DRF and Django idioms rely on calls in defaults
    "RUF012", # Django class attributes are mutable by design
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "common",
    "config",
    "geofences",
    "locations",
    "organizations",
    "presence",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers --reuse-db -ra"
filterwarnings = ["error::DeprecationWarning:presence.*", "error::DeprecationWarning:geofences.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["accounts", "common", "geofences", "locations", "organizations", "presence"]
omit = ["*/migrations/*", "*/tests/*"]
